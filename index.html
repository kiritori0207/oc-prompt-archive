
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LUMIÈRE ARCHIVE</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:#68758b;font-family:Georgia,"Times New Roman",serif;background:#f2f4f7}
.hero{position:relative;min-height:780px;overflow:hidden;background:linear-gradient(#cbd7e2,#e8e8e5 65%,#f6f6f4)}
.scene-image{position:absolute;inset:0 0 0;height:72%;background:linear-gradient(#bac8d5,#dbe0e3 65%,#f0efeb);background-position:center;background-size:cover}
.scene-image:after{content:"";position:absolute;inset:40% 0 -1px;background:linear-gradient(transparent,#f1f0ed 90%)}
.upload{position:absolute;z-index:5;top:18px;left:18px}
.upload label{display:inline-block;padding:10px 14px;border:1px solid #ffffffaa;border-radius:24px;background:#ffffffa6;color:#68758b;font:11px Arial,sans-serif;cursor:pointer}
.upload input{display:none}
.ground{position:absolute;bottom:0;left:-10%;width:120%;height:32%;border-radius:50% 50% 0 0/15% 15% 0 0;background:radial-gradient(ellipse at top,#fff 0%,#f5f5f3 55%,#e7ebf0 100%);box-shadow:0 -12px 40px #fff9}
.snow{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
.hero-content{position:absolute;z-index:4;top:44%;left:0;width:100%;padding:20px;text-align:center;transform:translateY(-10%)}
.eyebrow{font:10px Arial,sans-serif;letter-spacing:3px;color:white;text-shadow:0 1px 10px #52657b;margin-bottom:24px}
h1{font-size:clamp(38px,7vw,70px);font-weight:400;line-height:1.12;letter-spacing:-1.5px;color:white;text-shadow:0 2px 18px #71809688;margin:0}
h1 i{color:#fff8ff}
.subtitle{font:12px Arial,sans-serif;letter-spacing:1.5px;line-height:2;color:white;text-shadow:0 1px 12px #53657a;margin:24px 0}
.cta{border:1px solid #ffffffc9;border-radius:30px;padding:14px 24px;background:#ffffff38;color:white;font:10px Arial,sans-serif;letter-spacing:2px;cursor:pointer;backdrop-filter:blur(5px)}
.caption{position:absolute;bottom:16px;z-index:4;width:100%;text-align:center;font:9px Arial,sans-serif;letter-spacing:2px;color:#929dac}
.archive{padding:36px 20px 24px;background:linear-gradient(#f1f0ed,#f7f8fa)}
.section-title{text-align:center;font:10px Arial,sans-serif;letter-spacing:3px;color:#9aa8ba;margin-bottom:24px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:760px;margin:auto}
.card{position:relative;min-height:165px;text-align:left;padding:24px 20px;background:#ffffffb8;border:1px solid #e0e5ec;color:#8390a5;cursor:pointer}
.card small{display:block;font:9px Arial,sans-serif;letter-spacing:2px;color:#aab4c4}
.card strong{display:block;font-size:clamp(19px,3vw,27px);font-weight:400;margin-top:13px;color:#78869e}
.card p{font:11px Arial,sans-serif;line-height:1.7}
.card b{position:absolute;right:16px;bottom:14px;font-weight:400}
footer{text-align:center;padding:24px 10px;font:9px Arial,sans-serif;letter-spacing:2px;color:#a6afbe}
@media(max-width:500px){.hero{min-height:690px}.hero-content{top:43%}.cards{gap:8px}.card{padding:18px 12px;min-height:150px}.card p{font-size:10px}}
</style>
</head>
<body>
<section class="hero">
  <div class="scene-image" id="sceneImage"></div>
  <div class="upload">
    <label>＋ 街並みの画像を選ぶ<input id="imageInput" type="file" accept="image/*"></label>
  </div>
  <div class="ground"></div>
  <canvas class="snow" id="snow"></canvas>
  <div class="hero-content">
    <div class="eyebrow">✧ A LITTLE WORLD OF YOUR OWN ✧</div>
    <h1>Make your own<br><i>little universe.</i></h1>
    <p class="subtitle">キャラクターも、構図も、物語も。<br>あなたの「好き」を集める、小さなアーカイブ。</p>
    <button class="cta" onclick="document.getElementById('archive').scrollIntoView({behavior:'smooth'})">EXPLORE THE ARCHIVE　↘</button>
  </div>
  <div class="caption">A QUIET WINTER DAY · A WORLD OF IMAGINATION</div>
</section>
<section class="archive" id="archive">
  <div class="section-title">✧ &nbsp; COLLECT YOUR MAGIC &nbsp; ✧</div>
  <div class="cards">
    <button class="card" onclick="alert('キャラクター一覧ページはこれから作るよ！')"><small>01 / COLLECTION</small><strong>Characters</strong><p>大切なキャラクターたちを集めて。</p><b>↗</b></button>
    <button class="card" onclick="alert('構図一覧ページはこれから作るよ！')"><small>02 / INSPIRATION</small><strong>Compositions</strong><p>お気に入りの構図とアイデアを。</p><b>↗</b></button>
  </div>
  <footer>MADE OF DREAMS & LITTLE DETAILS　✧</footer>
</section>
<script>
const input=document.getElementById('imageInput');
input.addEventListener('change',()=>{
 const file=input.files[0];
 if(!file)return;
 const reader=new FileReader();
 reader.onload=e=>{
  document.getElementById('sceneImage').style.backgroundImage=`url("${e.target.result}")`;
 };
 reader.readAsDataURL(file);
});
const canvas=document.getElementById('snow');
const ctx=canvas.getContext('2d');
let w,h,dpr,flakes=[],last=0;
function makeFlake(initial){
 return{x:Math.random()*w,y:initial?Math.random()*h:-15,
 r:Math.random()<.65?Math.random()*2.2+1.2:Math.random()*3.5+2.5,
 speed:Math.random()*.8+.25,drift:Math.random()*1+.2,
 phase:Math.random()*6.28,twinkle:Math.random()*6.28,
 star:Math.random()<.25,alpha:Math.random()*.5+.35};
}
function resize(){
 const rect=canvas.getBoundingClientRect();
 w=rect.width;h=rect.height;dpr=Math.min(window.devicePixelRatio||1,2);
 canvas.width=w*dpr;canvas.height=h*dpr;
 ctx.setTransform(dpr,0,0,dpr,0,0);
 flakes=Array.from({length:Math.min(190,Math.max(80,Math.round(w*h/3000)))},()=>makeFlake(true));
}
function draw(time){
 const dt=Math.min((time-last)/16.67||1,2);last=time;
 ctx.clearRect(0,0,w,h);
 for(const f of flakes){
  f.y+=f.speed*dt;
  f.x+=Math.sin(time*.00035+f.phase)*f.drift*dt;
  f.twinkle+=.04*dt;
  if(f.y>h+15){Object.assign(f,makeFlake(false));f.x=Math.random()*w}
  if(f.x>w+10)f.x=-10;if(f.x< -10)f.x=w+10;
  const pulse=.5+.5*Math.sin(f.twinkle);
  ctx.globalAlpha=f.alpha*(f.star?.3+.7*pulse:1);
  ctx.fillStyle='#fff';ctx.shadowBlur=f.star?16:7;ctx.shadowColor='#fff';
  ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,Math.PI*2);ctx.fill();
  if(f.star&&pulse>.45){
   const size=f.r*(1.5+pulse);
   ctx.strokeStyle='rgba(255,255,255,'+(.4+pulse*.6)+')';ctx.lineWidth=1;
   ctx.beginPath();ctx.moveTo(f.x-size*2.5,f.y);ctx.lineTo(f.x+size*2.5,f.y);
   ctx.moveTo(f.x,f.y-size*2.5);ctx.lineTo(f.x,f.y+size*2.5);ctx.stroke();
  }
 }
 ctx.globalAlpha=1;ctx.shadowBlur=0;
 requestAnimationFrame(draw);
}
if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
 resize();requestAnimationFrame(draw);window.addEventListener('resize',resize);
}
</script>
</body>
</html>
