
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Characters</title>

  <style>
    :root {
      --page-bg: #f2f4f7;
      --film: #303642;
      --film-line: #454d5b;
      --white: #f8f9fc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 36px 24px 60px;
      background: var(--page-bg);
      font-family: sans-serif;
    }

    /* フィルムを並べるエリア */
    .film-gallery {
      width: min(100%, 1080px);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
      align-items: start;
    }

    /* 1列につき1本の、縦につながったフィルム */
    .film-strip {
      min-width: 0;
      display: grid;
      grid-template-columns: 15px minmax(0, 1fr) 15px;
      background: var(--film);
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(43, 52, 66, 0.09);
    }

    /* 両端の四角い穴。ページ背景色で抜けて見える */
    .film-rail {
      background:
        repeating-linear-gradient(
          to bottom,
          var(--page-bg) 0px,
          var(--page-bg) 9px,
          var(--film) 9px,
          var(--film) 23px
        );
      background-position: center 7px;
      background-repeat: repeat-y;
    }

    /* フィルム中央部分 */
    .film-inner {
      min-width: 0;
      padding: 9px 0;
      background: var(--film);
    }

    /* 写真を縦に連ねる */
    .film-frame {
      position: relative;
      margin: 0;
      padding: 8px 0;
      border-bottom: 1px solid var(--film-line);
    }

    .film-frame:last-child {
      border-bottom: none;
    }

    /* 横長の写真エリア */
    .photo {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(
          ellipse at 50% 35%,
          rgba(235, 176, 205, 0.48),
          transparent 48%
        ),
        linear-gradient(
          135deg,
          #6d718d,
          #a8a5c0 48%,
          #648c9a
        );
    }

    /* 仮画像ごとに違う色合い */
    .photo.pink {
      background:
        radial-gradient(ellipse at 65% 30%,
          rgba(255, 189, 220, 0.65), transparent 45%),
        linear-gradient(135deg, #55465f, #c77eaa 55%, #7889a8);
    }

    .photo.blue {
      background:
        radial-gradient(ellipse at 35% 35%,
          rgba(170, 227, 245, 0.6), transparent 48%),
        linear-gradient(135deg, #354b65, #648ea5 55%, #b6a9c8);
    }

    .photo.lilac {
      background:
        radial-gradient(ellipse at 55% 25%,
          rgba(255, 205, 230, 0.65), transparent 45%),
        linear-gradient(135deg, #6b526f, #a88eb9 55%, #718b9d);
    }

    .photo.cyan {
      background:
        radial-gradient(ellipse at 65% 35%,
          rgba(164, 239, 244, 0.65), transparent 46%),
        linear-gradient(135deg, #354d5a, #5f9da4 55%, #a5a0c1);
    }

    .photo.rose {
      background:
        radial-gradient(ellipse at 40% 28%,
          rgba(255, 190, 208, 0.65), transparent 46%),
        linear-gradient(135deg, #604757, #bb8299 55%, #7e8eaa);
    }

    .photo.night {
      background:
        radial-gradient(ellipse at 50% 35%,
          rgba(140, 177, 224, 0.5), transparent 46%),
        linear-gradient(135deg, #222d43, #596783 55%, #8e829f);
    }

    /* あとから追加する実画像 */
    .photo img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    /* フィルム写真の上に重ねる名前 */
    .character-name {
      position: absolute;
      z-index: 3;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 24px 10px 9px;
      color: var(--white);
      font-size: clamp(12px, 1.5vw, 16px);
      font-weight: 500;
      letter-spacing: 0.08em;
      background: linear-gradient(
        to bottom,
        transparent,
        rgba(24, 29, 39, 0.72)
      );
      overflow-wrap: anywhere;
    }

    /* 控えめなアナログ粒子感 */
    .photo::after {
      content: "";
      position: absolute;
      z-index: 2;
      inset: 0;
      pointer-events: none;
      opacity: 0.19;
      background-image:
        repeating-linear-gradient(
          0deg,
          transparent 0px,
          rgba(255,255,255,0.10) 1px,
          transparent 2px,
          transparent 4px
        ),
        repeating-linear-gradient(
          90deg,
          transparent 0px,
          rgba(15,20,35,0.12) 1px,
          transparent 2px,
          transparent 5px
        );
      mix-blend-mode: soft-light;
    }

    /* 小さい画面でも2列を維持 */
    @media (max-width: 520px) {
      body {
        padding: 20px 10px 36px;
      }

      .film-gallery {
        gap: 12px;
      }

      .film-strip {
        grid-template-columns: 9px minmax(0, 1fr) 9px;
      }

      .film-inner {
        padding: 5px 0;
      }

      .film-frame {
        padding: 5px 0;
      }

      .film-rail {
        background:
          repeating-linear-gradient(
            to bottom,
            var(--page-bg) 0px,
            var(--page-bg) 7px,
            var(--film) 7px,
            var(--film) 18px
          );
        background-position: center 5px;
        background-repeat: repeat-y;
      }

      .character-name {
        padding: 18px 5px 6px;
        font-size: 11px;
        letter-spacing: 0.03em;
      }
    }
  </style>
</head>

<body>
  <main class="film-gallery">

    <!-- 左のフィルム -->
    <section class="film-strip">
      <div class="film-rail" aria-hidden="true"></div>

      <div class="film-inner">
        <div class="film-frame">
          <div class="photo pink">
            <span class="character-name">キャラクター名</span>
          </div>
        </div>

        <div class="film-frame">
          <div class="photo blue">
            <span class="character-name">キャラクター名</span>
          </div>
        </div>

        <div class="film-frame">
          <div class="photo lilac">
            <span class="character-name">キャラクター名</span>
          </div>
        </div>
      </div>

      <div class="film-rail" aria-hidden="true"></div>
    </section>

    <!-- 右のフィルム -->
    <section class="film-strip">
      <div class="film-rail" aria-hidden="true"></div>

      <div class="film-inner">
        <div class="film-frame">
          <div class="photo cyan">
            <span class="character-name">キャラクター名</span>
          </div>
        </div>

        <div class="film-frame">
          <div class="photo rose">
            <span class="character-name">キャラクター名</span>
          </div>
        </div>

        <div class="film-frame">
          <div class="photo night">
            <span class="character-name">キャラクター名</span>
          </div>
        </div>
      </div>

      <div class="film-rail" aria-hidden="true"></div>
    </section>

  </main>
</body>
</html>
