
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUMIÈRE ARCHIVE</title>

  <style>
    :root {
      --background: #E9E8E6;
      --film: #362629;
      --hole: #D1D0CE;
      --text: #362629;
      --label: #E9E8E6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: "Helvetica Neue", Arial, sans-serif;
    }

    header {
      padding: 46px 24px 32px;
      text-align: center;
    }

    .site-title {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(25px, 5vw, 42px);
      font-weight: 400;
      letter-spacing: 0.14em;
    }

    .site-subtitle {
      margin-top: 12px;
      font-size: 10px;
      letter-spacing: 0.28em;
    }

    .filters {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 0 16px 34px;
    }

    .filter-button {
      padding: 8px 17px;
      border: 1px solid var(--film);
      border-radius: 0;
      background: transparent;
      color: var(--film);
      font-size: 10px;
      letter-spacing: 0.12em;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .filter-button:hover,
    .filter-button.active {
      background: var(--film);
      color: var(--background);
    }

    main {
      width: min(100%, 1200px);
      margin: 0 auto;
      padding: 0 22px 60px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(16px, 4vw, 42px);
      align-items: stretch;
      margin: 0 auto;
    }

    /* 1人だけなら1列表示 */
    .gallery.single-column {
      grid-template-columns: minmax(0, 1fr);
      max-width: 450px;
    }

    .film-column {
      position: relative;
      min-width: 0;
      padding: 24px 22px;
      background: var(--film);
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    /* フィルムの穴：間隔を狭く調整 */
    .film-column::before,
    .film-column::after {
      content: "";
      position: absolute;
      top: 12px;
      bottom: 12px;
      width: 9px;
      background-image: repeating-linear-gradient(
        to bottom,
        var(--hole) 0,
        var(--hole) 15px,
        transparent 15px,
        transparent 20px
      );
      pointer-events: none;
    }

    .film-column::before {
      left: 6px;
    }

    .film-column::after {
      right: 6px;
    }

    .character-card {
      width: 100%;
      min-width: 0;
      color: var(--label);
    }

    .character-image-wrap {
      width: 100%;
      aspect-ratio: 3 / 4;
      overflow: hidden;
      background: #C9C6C4;
    }

    .character-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.35s ease;
    }

    .character-card:hover .character-image {
      transform: scale(1.025);
    }

    .character-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 12px;
    }

    .character-name {
      min-width: 0;
      margin: 0;
      overflow-wrap: anywhere;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(13px, 2vw, 18px);
      font-weight: 400;
      letter-spacing: 0.04em;
    }

    .character-gender {
      flex-shrink: 0;
      padding: 4px 8px;
      border: 1px solid rgba(233, 232, 230, 0.7);
      color: var(--label);
      font-size: 9px;
      letter-spacing: 0.08em;
    }

    .empty-message {
      grid-column: 1 / -1;
      padding: 60px 20px;
      text-align: center;
      font-size: 12px;
      letter-spacing: 0.1em;
    }

    footer {
      padding: 20px;
      text-align: center;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 10px;
      letter-spacing: 0.2em;
      opacity: 0.7;
    }

    @media (max-width: 520px) {
      header {
        padding-top: 34px;
      }

      main {
        padding-right: 12px;
        padding-left: 12px;
      }

      .gallery {
        gap: 10px;
      }

      .film-column {
        padding: 18px 15px;
        gap: 22px;
      }

      .film-column::before {
        left: 4px;
      }

      .film-column::after {
        right: 4px;
      }

      .film-column::before,
      .film-column::after {
        width: 6px;
      }

      .character-info {
        align-items: flex-start;
        flex-direction: column;
        gap: 7px;
      }

      .character-name {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1 class="site-title">LUMIÈRE ARCHIVE</h1>
    <div class="site-subtitle">CHARACTER COLLECTION</div>
  </header>

  <nav class="filters" aria-label="キャラクターの絞り込み">
    <button class="filter-button active" data-filter="ALL">ALL</button>
    <button class="filter-button" data-filter="OC">OC</button>
    <button class="filter-button" data-filter="OUR WORLD">OUR WORLDS</button>
  </nav>

  <main>
    <div class="gallery" id="gallery"></div>
  </main>

  <footer>LUMIÈRE ARCHIVE</footer>

  <script>
    /*
      キャラクター追加用リスト

      name     : キャラクター名
      image    : 画像の保存場所
      category : "OC" または "OUR WORLD"
      gender   : 表示する性別ラベル
    */

    const characters = [
      {
        name: "CHARACTER 01",
        image: "images/character-01.jpg",
        category: "OC",
        gender: "MALE"
      },
      {
        name: "CHARACTER 02",
        image: "images/character-02.jpg",
        category: "OUR WORLD",
        gender: "FEMALE"
      },
      {
        name: "CHARACTER 03",
        image: "images/character-03.jpg",
        category: "OC",
        gender: "MALE"
      },
      {
        name: "CHARACTER 04",
        image: "images/character-04.jpg",
        category: "OUR WORLD",
        gender: "OTHER"
      }
    ];

    const gallery = document.getElementById("gallery");
    const filterButtons = document.querySelectorAll(".filter-button");

    let currentFilter = "ALL";

    function createCharacterCard(character) {
      const card = document.createElement("article");
      card.className = "character-card";

      const imageWrap = document.createElement("div");
      imageWrap.className = "character-image-wrap";

      const image = document.createElement("img");
      image.className = "character-image";
      image.src = character.image;
      image.alt = character.name;
      image.loading = "lazy";

      imageWrap.appendChild(image);

      const info = document.createElement("div");
      info.className = "character-info";

      const name = document.createElement("h2");
      name.className = "character-name";
      name.textContent = character.name;

      const gender = document.createElement("span");
      gender.className = "character-gender";
      gender.textContent = character.gender;

      info.append(name, gender);
      card.append(imageWrap, info);

      return card;
    }

    function renderGallery() {
      gallery.replaceChildren();
      gallery.classList.remove("single-column");

      const filtered = characters.filter(character => {
        return currentFilter === "ALL" ||
               character.category === currentFilter;
      });

      if (filtered.length === 0) {
        const message = document.createElement("div");
        message.className = "empty-message";
        message.textContent = "NO CHARACTERS";
        gallery.appendChild(message);
        return;
      }

      const leftColumn = document.createElement("div");
      leftColumn.className = "film-column";

      const rightColumn = document.createElement("div");
      rightColumn.className = "film-column";

      filtered.forEach((character, index) => {
        const card = createCharacterCard(character);

        if (index % 2 === 0) {
          leftColumn.appendChild(card);
        } else {
          rightColumn.appendChild(card);
        }
      });

      /* 1人なら右列を表示せず、2人以上なら左右2列 */
      if (filtered.length === 1) {
        gallery.classList.add("single-column");
        gallery.appendChild(leftColumn);
      } else {
        gallery.append(leftColumn, rightColumn);
      }
    }

    filterButtons.forEach(button => {
      button.addEventListener("click", () => {
        currentFilter = button.dataset.filter;

        filterButtons.forEach(item => {
          item.classList.toggle("active", item === button);
        });

        renderGallery();
      });
    });

    renderGallery();
  </script>
</body>
</html>
